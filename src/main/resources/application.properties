spring.application.name=travel_system

# 数据库配置
spring.datasource.url=jdbc:mysql://localhost:3306/travel_system?useSSL=false&serverTimezone=UTC&characterEncoding=utf-8&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=10000

# JPA/Hibernate??
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true


# Redis
spring.data.redis.url=redis://localhost:6379/0

# JWT配置
jwt.secret=6f73b1e6f8578ad12f72b64a4d244d2b7848b6ef79ff64a94ed295303946b803
jwt.expiration=7200
jwt.refresh-expiration=2592000
jwt.algorithm=HS256
jwt.token-prefix=Bearer

# 微信小程序配置
wechat.appid=wx5548ad39874b253e
wechat.appsecret=5393c3da18a084f4b81908a1ca9f1521
wechat.login-url=https://api.weixin.qq.com/sns/jscode2session

# 日志配置
logging.level.root=info
logging.level.com.travel=debug
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.file.name=logs/travel_system.log
logging.file.max-size=10MB
logging.file.max-history=7

# OSS配置
oss.endpoint=oss-cn-beijing.aliyuncs.com
oss.access-key-id=${ALIBABA_CLOUD_ACCESS_KEY_ID}
oss.access-key-secret=${ALIBABA_CLOUD_ACCESS_KEY_SECRET}
oss.bucket-name=self-travel-system

# 文件上传配置
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB


ai.api.url=https://api.deepseek.com/v1/chat/completions
ai.api.key=${DEEP_SEEK_API_KEY}
ai.api.model=deepseek-chat

# 逆地理编码配置
geocoding.provider=amap
geocoding.amap.key=${AMAP_KEY:37e66f4c2bbce9b688e68b15bbec48d5}
geocoding.amap.base-url=https://restapi.amap.com/v3/geocode/regeo
geocoding.tencent.key=${TENCENT_MAP_KEY:CBSBZ-R7JWV-7R2PE-5XWYK-LJAJ3-LZBEK}
geocoding.tencent.base-url=https://apis.map.qq.com/ws/geocoder/v1/
geocoding.cache-expire-hours=24
geocoding.request-timeout-ms=5000
geocoding.max-retries=3

# ??ID??????
